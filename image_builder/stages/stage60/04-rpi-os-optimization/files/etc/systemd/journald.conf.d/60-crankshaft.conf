[Journal]
# Keep the journal across restarts so Save logs can include the previous
# boot (after a hang, a restart is the only way out).
Storage=persistent
# The car cuts power without a shutdown: write to the SD card often so the
# last seconds before a hang are not lost (default is every 5 minutes).
SyncIntervalSec=10s
# Keep log growth bounded on embedded storage while retaining useful history.
SystemMaxUse=64M
RuntimeMaxUse=32M
MaxRetentionSec=7day
