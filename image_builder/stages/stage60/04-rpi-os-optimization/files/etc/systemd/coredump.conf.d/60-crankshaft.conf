# Crankshaft: keep a few crash dumps so Save logs can include a backtrace
# when the UI or core crashes. Sizes are capped for the small SD card and
# the 512 MB Pi Zero 2 W (dumps are compressed).
[Coredump]
Storage=external
Compress=yes
ProcessSizeMax=300M
ExternalSizeMax=300M
MaxUse=600M
KeepFree=1G
